services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mavi_connect}
      POSTGRES_USER: ${POSTGRES_USER:-mavi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mavi}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend-python
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://mavi:mavi@database:5432/mavi_connect}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend-next
    environment:
      API_URL: ${API_URL:-http://api:8000}
      ORDER_CUTOFF_TIME: ${ORDER_CUTOFF_TIME:-10:00}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Sao_Paulo}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:

